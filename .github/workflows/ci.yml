name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: draftly
          POSTGRES_USER: draftly
          POSTGRES_PASSWORD: draftly-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U draftly -d draftly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-signing-secret-key-at-least-32-chars
      DATABASE_URL: postgresql+psycopg2://draftly:draftly-ci-password@localhost:5432/draftly
      LLM_PROVIDER: ollama
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: Backend
      - run: alembic upgrade head
        working-directory: Backend
      - run: python scripts/smoke_health.py
        working-directory: Backend
      - run: pytest -q
        working-directory: Backend
